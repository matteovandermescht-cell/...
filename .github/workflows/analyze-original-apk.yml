name: Analyze original APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/matteovandermescht-cell/.../releases/download/original-apk/BRFMod_v70.apk' \
            --output work/BRFMod_v70.apk
          echo "Downloaded bytes: $(stat -c%s work/BRFMod_v70.apk)"
          echo "b138487c254a38542d288c6dc8aa8cdda9f08b61e9c4e4a92d0b0199cd685281  work/BRFMod_v70.apk" | sha256sum --check

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$url"
          curl -fL --retry 3 "$url" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          echo "/tmp/jadx/bin" >> "$GITHUB_PATH"

      - name: Decompile APK (keep partial results if JADX reports errors)
        shell: bash
        env:
          JAVA_OPTS: -Xmx5g
        run: |
          set -uo pipefail
          mkdir -p output/decompiled
          set +e
          jadx --show-bad-code --threads-count 2 -d output/decompiled work/BRFMod_v70.apk 2>&1 | tee output/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          echo "$jadx_status" > output/jadx-exit-code.txt
          echo "JADX exit code: $jadx_status"

      - name: Extract compact UI-focused report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/ui-candidates
          unzip -Z1 work/BRFMod_v70.apk > output/apk-entries.txt
          {
            echo "APK SHA256:"
            sha256sum work/BRFMod_v70.apk
            echo
            echo "JADX exit code:"
            cat output/jadx-exit-code.txt 2>/dev/null || echo "not available"
            echo
            echo "APK top-level entries:"
            head -n 300 output/apk-entries.txt
            echo
            echo "Decompiled file count:"
            find output/decompiled -type f | wc -l
            echo
            echo "UI-related Java/Kotlin source candidates:"
            grep -RIlE 'WindowManager|PopupWindow|Floating|TextView|Button|Switch|SeekBar|setAlpha|setBackground|Compose|Material' output/decompiled/sources 2>/dev/null | head -n 250 || true
            echo
            echo "Layout/resource XML candidates:"
            find output/decompiled/resources -type f \( -iname '*layout*.xml' -o -path '*/res/layout/*' -o -path '*/res/drawable*/*' -o -path '*/res/color/*' \) 2>/dev/null | head -n 250 || true
          } > output/ui-analysis-report.txt
          # Keep only a compact sample of UI-related source files, with a strict size cap.
          total=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            [ "$size" -le 500000 ] || continue
            [ $((total + size)) -le 12000000 ] || break
            dest="output/ui-candidates/$(basename "$file")"
            cp "$file" "$dest"
            total=$((total + size))
          done < <(grep -RIlE 'WindowManager|PopupWindow|Floating|TextView|Button|Switch|SeekBar|setAlpha|setBackground|Compose|Material' output/decompiled/sources 2>/dev/null | head -n 250 || true)


      - name: Extract app-specific code and native UI indicators
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/deep-scan
          {
            echo "=== Package and activity metadata ==="
            grep -nE 'package=|activity|service|receiver|application' output/decompiled/resources/AndroidManifest.xml 2>/dev/null | head -n 200 || true
            echo
            echo "=== All non-library Java/Kotlin class paths ==="
            find output/decompiled/sources -type f \( -name '*.java' -o -name '*.kt' \) | grep -vE '/(androidx|com/google|kotlin|io/flutter|io/sentry|zendesk|com/facebook|com/appsflyer|okhttp3|okio|org/)' | sort | sed -n '1,2500p'
            echo
            echo "=== Overlay/menu-related source matches ==="
            grep -RInE 'WindowManager|TYPE_APPLICATION_OVERLAY|addView\(|removeView\(|PopupWindow|LayoutParams|onTouch|setOnClickListener|setVisibility|透明|菜单|浮窗|overlay|mod.?menu|menu.?view|draw.*menu' output/decompiled/sources/defpackage output/decompiled/sources/com/supercell 2>/dev/null | head -n 1500 || true
            echo
            echo "=== Relevant APK asset paths ==="
            grep -Ei 'overlay|menu|mod|icon|font|flutter_assets|assets/.*(json|html|css|js|ttf|otf|png|webp)' output/apk-entries.txt | head -n 2000 || true
          } > output/deep-scan/deep-scan-report.txt
          # Preserve complete app-owned package sources and obfuscated defpackage sources in a capped archive.
          mkdir -p output/deep-scan/sources
          total=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            [ "$size" -le 300000 ] || continue
            [ $((total + size)) -le 20000000 ] || break
            rel="${file#output/decompiled/sources/}"
            mkdir -p "output/deep-scan/sources/$(dirname "$rel")"
            cp "$file" "output/deep-scan/sources/$rel"
            total=$((total + size))
          done < <(find output/decompiled/sources/com/supercell output/decompiled/sources/defpackage -type f -name '*.java' 2>/dev/null | sort)
          # Extract strings from game/native libraries and dex files, filtering for likely UI/overlay labels.
          while IFS= read -r entry; do
            case "$entry" in
              *.dex|*.so|*.so.*)
                unzip -p work/BRFMod_v70.apk "$entry" 2>/dev/null | strings -n 5 | grep -Ei 'overlay|floating|window.?manager|popup|menu|visual|combat|settings|switch|slider|button|opacity|alpha|透明|菜单|悬浮|mod.?menu' | head -n 1000 | sed "s#^#$entry: #" >> output/deep-scan/native-and-dex-strings.txt || true
                ;;
            esac
          done < output/apk-entries.txt

      - name: Upload deeper app code scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRFMod-v70-deep-scan
          path: output/deep-scan/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

      - name: Upload compact UI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRFMod-v70-UI-analysis
          path: |
            output/ui-analysis-report.txt
            output/jadx-exit-code.txt
            output/ui-candidates/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
