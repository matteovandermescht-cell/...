name: Analyze original APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/matteovandermescht-cell/.../releases/download/original-apk/BRFMod_v70.apk' \
            --output work/BRFMod_v70.apk
          echo "Downloaded bytes: $(stat -c%s work/BRFMod_v70.apk)"
          echo "b138487c254a38542d288c6dc8aa8cdda9f08b61e9c4e4a92d0b0199cd685281  work/BRFMod_v70.apk" | sha256sum --check

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$url"
          curl -fL --retry 3 "$url" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          echo "/tmp/jadx/bin" >> "$GITHUB_PATH"

      - name: Decompile APK (keep partial results if JADX reports errors)
        shell: bash
        env:
          JAVA_OPTS: -Xmx5g
        run: |
          set -uo pipefail
          mkdir -p output/decompiled
          set +e
          jadx --show-bad-code --threads-count 2 -d output/decompiled work/BRFMod_v70.apk 2>&1 | tee output/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          echo "$jadx_status" > output/jadx-exit-code.txt
          echo "JADX exit code: $jadx_status"
          echo "JADX may return exit code 3 when some classes cannot be decompiled; partial output is retained."

      - name: Create analysis report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "APK: BRFMod_v70.apk"
            echo "Expected SHA256: b138487c254a38542d288c6dc8aa8cdda9f08b61e9c4e4a92d0b0199cd685281"
            echo
            echo "JADX exit code:"
            cat output/jadx-exit-code.txt 2>/dev/null || echo "not available"
            echo
            echo "Top-level APK entries (first 250):"
            unzip -Z1 work/BRFMod_v70.apk > output/apk-entries.txt
            head -n 250 output/apk-entries.txt
            echo
            echo "Decompiled file count:"
            find output/decompiled -type f | wc -l
            echo
            echo "Decompiled paths (first 500):"
            find output/decompiled -type f > output/decompiled-files.txt
            head -n 500 output/decompiled-files.txt
          } > output/analysis-report.txt

      - name: Upload partial or complete analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRFMod-v70-analysis
          path: |
            output/analysis-report.txt
            output/jadx.log
            output/jadx-exit-code.txt
            output/apk-entries.txt
            output/decompiled-files.txt
            output/decompiled/sources/
            output/decompiled/resources/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
