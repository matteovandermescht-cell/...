name: Locate native UI labels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-native-ui-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install native analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file unzip

      - name: Download and verify the original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          curl --fail --location --retry 5 --retry-all-errors \
            'https://github.com/matteovandermescht-cell/.../releases/download/original-apk/BRFMod_v70.apk' \
            --output work/BRFMod_v70.apk
          echo "Downloaded bytes: $(stat -c%s work/BRFMod_v70.apk)"
          echo "b138487c254a38542d288c6dc8aa8cdda9f08b61e9c4e4a92d0b0199cd685281  work/BRFMod_v70.apk" | sha256sum --check

      - name: Extract native UI library
        shell: bash
        run: |
          set -euo pipefail
          entry='lib/arm64-v8a/libbrf.so'
          unzip -Z1 work/BRFMod_v70.apk | grep -Fx "$entry"
          unzip -p work/BRFMod_v70.apk "$entry" > work/libbrf.so
          {
            echo "Original APK SHA256:"
            sha256sum work/BRFMod_v70.apk
            echo
            echo "Native library:"
            file work/libbrf.so
            sha256sum work/libbrf.so
            echo
            echo "ELF header and sections:"
            readelf -h work/libbrf.so
            readelf -SW work/libbrf.so
            echo
            echo "Exported dynamic symbols:"
            readelf -Ws work/libbrf.so
          } > output/native-library-metadata.txt

      - name: Locate Combat and visible UI labels
        shell: bash
        run: |
          set -euo pipefail
          strings -a -t x -n 3 work/libbrf.so > output/libbrf-ascii-strings-with-offsets.txt
          strings -el -t x -n 3 work/libbrf.so > output/libbrf-utf16le-strings-with-offsets.txt

          pattern='auto[ _-]?farm|combat|visuals?|preferences|menu palette|trophy goal|stop farming|choose next brawler|next brawler|lowest trophies|closest to goal|return|feature status'

          {
            echo "APK SHA256:"
            sha256sum work/BRFMod_v70.apk
            echo
            echo "Library SHA256:"
            sha256sum work/libbrf.so
            echo
            echo "Search terms: $pattern"
            echo
            echo "=== ASCII strings (file offsets) ==="
            grep -Ein "$pattern" output/libbrf-ascii-strings-with-offsets.txt || true
            echo
            echo "=== UTF-16LE strings (file offsets) ==="
            grep -Ein "$pattern" output/libbrf-utf16le-strings-with-offsets.txt || true
          } > output/combat-tab-label-locations.txt

      - name: Upload read-only label-location report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRFMod-v70-combat-ui-label-locations
          path: |
            output/native-library-metadata.txt
            output/libbrf-ascii-strings-with-offsets.txt
            output/libbrf-utf16le-strings-with-offsets.txt
            output/combat-tab-label-locations.txt
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14
