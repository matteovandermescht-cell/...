name: Import original APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-original-apk.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Read SwissTransfer metadata
        env:
          SWISSTRANSFER_ID: 01a1f424-4571-7276-b284-35fde8742e32
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const id = process.env.SWISSTRANSFER_ID;
          (async () => {
            const response = await fetch('https://www.swisstransfer.com/api/isPasswordValid', {
              method: 'POST',
              headers: {
                'User-Agent': 'swisstransfer-webext/1.0',
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Referer': `https://www.swisstransfer.com/d/${id}`
              },
              body: JSON.stringify({ linkUUID: id, password: '' })
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`SwissTransfer metadata HTTP ${response.status}: ${body.slice(0, 500)}`);
            let info;
            try { info = JSON.parse(body); } catch { throw new Error('SwissTransfer returned invalid metadata JSON'); }
            if (!info || info === false || !info.container || !Array.isArray(info.container.files)) {
              throw new Error('SwissTransfer did not return a readable file list. The transfer may require a password.');
            }
            if (info.container.needPassword) throw new Error('This transfer is password-protected; a password is required.');
            const apk = info.container.files.find(f => String(f.fileName || '').toLowerCase().endsWith('.apk'));
            if (!apk) throw new Error('No .apk file was found in this SwissTransfer transfer.');
            if (!Number.isSafeInteger(Number(apk.fileSizeInBytes)) || Number(apk.fileSizeInBytes) <= 0) {
              throw new Error('SwissTransfer returned an invalid file size.');
            }
            if (Number(apk.fileSizeInBytes) >= 2147483648) throw new Error('APK exceeds GitHub Release 2 GiB asset limit.');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/swiss-transfer.json', JSON.stringify({ id, file: apk }));
            console.log('SwissTransfer file:', apk.fileName);
            console.log('Expected size:', apk.fileSizeInBytes, 'bytes');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Download original APK
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/swiss-transfer.json"
          FILE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).file.fileName")"
          FILE_UUID="$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).file.UUID")"
          EXPECTED_SIZE="$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).file.fileSizeInBytes")"
          TRANSFER_ID="$(node -p "JSON.parse(require('fs').readFileSync('$META','utf8')).id")"
          mkdir -p "$RUNNER_TEMP/apk"
          FILE="$RUNNER_TEMP/apk/$FILE_NAME"
          URL="https://www.swisstransfer.com/api/download/$TRANSFER_ID/$FILE_UUID"
          echo "Downloading: $FILE_NAME ($EXPECTED_SIZE bytes)"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 21600 --continue-at - \
            -H 'User-Agent: swisstransfer-webext/1.0' \
            -H "Referer: https://www.swisstransfer.com/d/$TRANSFER_ID" \
            "$URL" --output "$FILE"
          ACTUAL_SIZE="$(stat -c '%s' "$FILE")"
          echo "Actual size: $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" -ne "$EXPECTED_SIZE" ]; then
            echo "::error::Downloaded size does not match SwissTransfer metadata."
            exit 1
          fi
          if [ "$(head -c 2 "$FILE")" != "PK" ]; then
            echo "::error::Downloaded file does not have an APK/ZIP signature."
            exit 1
          fi
          SHA256="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
          echo "SHA256: $SHA256"
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"
          echo "APK_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "APK_SIZE=$ACTUAL_SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload unchanged APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create original-apk "$APK_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Original APK" \
            --notes "Original APK transferred from the supplied SwissTransfer link without intentional modification. Filename: $APK_NAME. Size: $APK_SIZE bytes. SHA-256: $APK_SHA256"

      - name: Verify uploaded release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view original-apk --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/release.json", "utf8"));
            const asset = data.assets.find(a => a.name === process.env.APK_NAME);
            if (!asset) throw new Error("Uploaded APK asset not found");
            if (asset.size !== Number(process.env.APK_SIZE)) throw new Error("Uploaded size differs from downloaded size");
            console.log("Verified asset:", asset.name);
            console.log("Verified size:", asset.size, "bytes");
            console.log("Browser download URL:", asset.browser_download_url);
          '
